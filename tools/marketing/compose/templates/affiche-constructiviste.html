<!doctype html>
<!-- Affiche 2:3, direction « propagande syndicale constructiviste » : logo mono noir officiel
     (SVG incrusté) sur le papier crème en haut à gauche, mot d'ordre en capitales condensées
     dans la bande rouge laissée libre en bas par le key art, crédits sur une ligne. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { font-size: {{width}}px; background: #EFE4CC; }
  .canvas { font-size: 0.01em; }
  .logo { position: absolute; left: 6%; top: 4.4%; width: 44%; }
  .band {
    position: absolute; left: 6%; right: 6%; bottom: 3.1%; height: 11.6%;
    display: flex; flex-direction: column; justify-content: center; gap: 0.9em;
    color: #F6EEDC; font-family: var(--font-cond); text-transform: uppercase;
  }
  .slogan { font-weight: 700; font-size: 7.1em; line-height: 0.92; letter-spacing: 0.005em; }
  .slogan b { color: #14101A; font-weight: 700; }
  .credits-line { font-weight: 600; font-size: 1.75em; letter-spacing: 0.2em; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="canvas">
  <img class="art" src="{{art}}" alt="">
  <img class="logo" src="{{logoUrl}}" alt="PRIVATIX">
  <div class="band">
    <div class="slogan">Le rail n’est pas <b>à vendre !</b></div>
    <div class="credits-line"><span>Un cheminot en 3x8 contre la privatisation du rail</span><span>OCC MONS Studios</span></div>
  </div>
</div>
</body>
</html>
