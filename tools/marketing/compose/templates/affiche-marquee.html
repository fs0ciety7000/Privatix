<!doctype html>
<!-- Affiche 2:3, composition « Marquise » : titre néon centré en tête comme l'enseigne
     d'un hall de gare, accroche en capitales espacées, bande de crédits en trois colonnes. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { font-size: {{width}}px; }               /* 1em = largeur ; on travaille en fractions */
  .canvas { font-size: 0.01em; }                 /* 1em = 1 % de la largeur */
  .shade-top {
    position: absolute; inset: 0 0 auto 0; height: 30%;
    background: linear-gradient(180deg, rgba(10,8,24,.88) 0%, rgba(10,8,24,.55) 55%, rgba(10,8,24,0) 100%);
  }
  .head { position: absolute; top: 3.4%; left: 0; right: 0; text-align: center; }
  .head .neon { font-size: 15.2em; }
  .tagline {
    display: inline-flex; align-items: center; gap: 0.9em; margin-top: 0.6em;
    font-family: var(--font-cond); font-weight: 600; font-size: 3.1em;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--px-cream);
    text-shadow: 0 0.06em 0 var(--px-ink), 0 0 0.6em rgba(10,8,24,.9);
  }
  .tagline::before, .tagline::after {
    content: ''; width: 2.2em; height: 0.09em; background: var(--px-hero);
    box-shadow: 0 0.06em 0 var(--px-ink);
  }
  .credits { font-size: 2.15em; height: 15%; padding: 3.2em 6% 0; }
</style>
</head>
<body>
<div class="canvas">
  <img class="art" src="{{art}}" alt="">
  <div class="shade-top"></div>
  <div class="head">
    <div class="neon">PRIVATIX</div>
    <div class="tagline">{{tagline}}</div>
  </div>
  <footer class="credits">
    <div class="studio">
      <img src="{{studioUrl}}" alt="">
      <div><span class="studio__kicker">Développé par</span><span class="studio__name">OCC MONS Studios</span></div>
    </div>
    <div class="platforms">PC <i></i> Mac <i></i> Linux <i></i> Navigateur</div>
    <div class="sncb"><img src="../assets/sncb-mono-blanc.png" alt="SNCB"></div>
  </footer>
</div>
</body>
</html>
