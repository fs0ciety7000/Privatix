<!doctype html>
<!-- Bannière 16:9 : logo monochrome blanc et accroche dans le tiers droit (laissé dégagé par le key art),
     crédits en une ligne discrète en pied ; marges de recadrage de 6 % respectées. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { font-size: {{width}}px; }
  .canvas { font-size: 0.01em; }
  /* recadrage : rogne le cadre translucide parasite sur les bords du key art */
  .art { transform: scale({{artScale}}); transform-origin: {{artOrigin}}; }
  .shade-right {
    position: absolute; inset: 0 0 0 auto; width: 52%;
    background: linear-gradient(270deg, rgba(10,8,24,.8) 0%, rgba(10,8,24,.45) 55%, rgba(10,8,24,0) 100%);
  }
  .head { position: absolute; top: 7%; right: 6%; text-align: right; }
  .head .logo-mono {
    display: block; width: 34em; margin-left: auto;
    filter: drop-shadow(0 0.3em 0.8em rgba(10,8,24,.85));
  }
  .tagline {
    margin-top: 0.7em; font-family: var(--font-cond); font-weight: 600; font-size: 1.9em;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--px-cream);
    text-shadow: 0 0.06em 0 var(--px-ink), 0 0 0.6em rgba(10,8,24,.9);
  }
  .tagline::before {
    content: ''; display: inline-block; vertical-align: middle; width: 2em; height: 0.09em;
    margin-right: 0.8em; background: var(--px-hero); box-shadow: 0 0.06em 0 var(--px-ink);
  }
  .credits {
    font-size: 1.12em; height: 13%; padding: 2.6em 6% 0;
    background: linear-gradient(180deg, rgba(10,8,24,0) 0%, rgba(10,8,24,.85) 55%, rgba(10,8,24,.95) 100%);
  }
  .credits::before { display: none; }
</style>
</head>
<body>
<div class="canvas">
  <img class="art" src="{{art}}" alt="">
  <div class="shade-right"></div>
  <div class="head">
    <img class="logo-mono" src="{{logoUrl}}" alt="PRIVATIX">
    <div class="tagline">{{tagline}}</div>
  </div>
  <footer class="credits">
    <div class="studio">
      <img class="studio__dragon" src="../../../../site/src/assets/brand/interactive.svg" alt="">
      <div class="studio__text">
        <img class="studio__wordmark" src="../../../../site/src/assets/brand/occ-interactive-wordmark.svg" alt="OCC Interactive">
        <span class="studio__holding">une division de <img src="../../../../site/src/assets/brand/cardor-media-wordmark.svg" alt="CARDOR Media"></span>
      </div>
    </div>
    <div class="platforms">PC <i></i> Mac <i></i> Linux <i></i> Navigateur</div>
    <div class="sncb"><img src="../assets/sncb-mono-blanc.png" alt="SNCB"></div>
  </footer>
</div>
</body>
</html>
