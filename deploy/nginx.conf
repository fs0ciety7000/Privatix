server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Fichiers fingerprintés par Vite : cache long.
  location ~* /bundle/|/3d/assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /assets/ { expires 7d; try_files $uri =404; }

  location = /3d { return 301 /3d/; }
  location /3d/ { try_files $uri $uri/ /3d/index.html; add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
