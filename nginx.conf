server {
    listen 80;
    listen [::]:80;
    server_name _;

    # /        site vitrine (site/dist)
    # /jouer/  le jeu (dist racine : index.html Phaser, play3d.html Three.js)
    # /3d/     le prototype 3D (prototypes/proto3d/dist)
    root /usr/share/nginx/html;
    index index.html;

    # Compression (JS, JSON des cartes/atlas, CSS, SVG, XML des polices bitmap)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml text/xml image/svg+xml;

    # En-têtes de sécurité minimaux (à répéter dans chaque location qui pose un add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check pour Docker/Coolify
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ─── Anciennes adresses ───
    # La 3D du jeu était servie à la racine : redirection permanente, paramètres conservés (?q=, ?rm=…)
    location = /play3d.html { return 301 /jouer/play3d.html$is_args$args; }

    # ─── Jeu (/jouer/) ───
    location = /jouer { return 301 /jouer/$is_args$args; }

    # Bundles Vite hashés (dist/bundle) : immuables, cache 1 an
    location /jouer/bundle/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Assets du jeu (public/assets, non hashés) : cache 1 jour + revalidation ETag.
    # Pas de fallback ici : un asset manquant doit renvoyer 404,
    # sinon le loader Phaser recevrait du HTML à la place d'un JSON/PNG.
    location /jouer/assets/ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Pages du jeu (index.html, play3d.html) : toujours revalidées pour récupérer les nouveaux bundles
    location /jouer/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /jouer/index.html;
    }

    # ─── Prototype 3D (/3d/) : bundles hashés immuables, page revalidée, assets manquants en 404 ───
    location = /3d { return 301 /3d/; }
    location /3d/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    location /3d/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /3d/index.html;
    }

    # ─── Site vitrine (/) ───
    # Bundles, images et vidéo hashés du site (site/dist/bundle) : immuables, cache 1 an
    location /bundle/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Instantané des GitHub Releases (rafraîchi au build et au démarrage du conteneur)
    location = /releases.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Fichiers publics à la racine (favicon, image de partage, robots.txt) : non hashés, cache 1 jour
    location ~ ^/[^/]+\.(?:svg|png|jpg|webp|ico|txt|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html du site : toujours revalidé
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Page unique : toute autre adresse sert le site (hérite des en-têtes du bloc server)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
