server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression (JS, JSON des cartes/atlas, CSS, SVG, XML des polices bitmap)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml text/xml image/svg+xml;

    # En-têtes de sécurité minimaux
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check pour Docker/Coolify
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Bundles Vite hashés (dist/bundle) : immuables, cache 1 an
    location /bundle/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Assets du jeu (public/assets, non hashés) : cache 1 jour + revalidation ETag.
    # Pas de fallback SPA ici : un asset manquant doit renvoyer 404,
    # sinon le loader Phaser recevrait du HTML à la place d'un JSON/PNG.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Prototype 3D (/3d/) : bundles hashés immuables, page revalidée, assets manquants en 404
    location = /3d { return 301 /3d/; }
    location /3d/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    location /3d/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /3d/index.html;
    }

    # index.html : toujours revalidé pour récupérer les nouveaux bundles après déploiement
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Fallback SPA (hérite des en-têtes du bloc server : aucun add_header ici)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
